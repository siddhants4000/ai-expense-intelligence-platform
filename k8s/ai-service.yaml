apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: ai-expense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ai-expense-intelligence-platform-ai-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: ai-expense
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000