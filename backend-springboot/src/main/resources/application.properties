spring.application.name=ai-expense-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/expense_db
spring.datasource.username=expense_user
spring.datasource.password=expense_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.data.redis.host=localhost
spring.data.redis.port=6379

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

